<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅前必读</title>
<style>
  :root {
    --color-primary: #7BAED4;
    --color-primary-light: #A8C8E0;
    --color-primary-lighter: #E8F0F8;
    --color-accent: #B8A9D4;
    --color-accent-light: #DDD0EE;
    --color-accent-lighter: #F3EEF8;
    --color-bg: #FFFFFF;
    --color-text: #3A3A3A;
    --color-text-light: #6A6A6A;
    --color-text-lighter: #9A9A9A;
    --color-line: #E8E8E8;
    --radius: 8px;
    --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
    --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.8;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .main-container {
    max-width: 780px;
    margin: 0 auto;
    padding: 60px 24px 60px;
  }
  .chapter-header {
    text-align: center;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--color-line);
    margin-bottom: 32px;
  }
  .chapter-title {
    font-family: var(--font-serif);
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--color-text);
    letter-spacing: 1px;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .chapter-intro {
    background: linear-gradient(to right, var(--color-primary-lighter), var(--color-accent-lighter));
    border-left: 3px solid var(--color-primary-light);
    padding: 16px 20px;
    margin-bottom: 32px;
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 0.92rem;
    color: var(--color-text-light);
    line-height: 1.9;
  }
  .chapter-intro .intro-label {
    font-size: 0.78rem;
    color: var(--color-primary);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .author-note-wrapper {
    margin: 28px 0;
    border: 1.5px dashed var(--color-accent-light);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .author-note-wrapper .note-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: var(--color-accent-lighter);
    cursor: pointer;
    user-select: none;
  }
  .author-note-wrapper .note-header:hover { background: var(--color-accent-light); }
  .author-note-wrapper .note-title {
    font-size: 0.85rem;
    color: var(--color-accent);
    font-weight: 600;
  }
  .author-note-wrapper .note-toggle {
    font-size: 0.75rem;
    color: var(--color-accent);
    transition: transform 0.3s;
  }
  .author-note-wrapper.collapsed .note-toggle { transform: rotate(-90deg); }
  .author-note-wrapper .note-body {
    padding: 14px 20px;
    font-size: 0.88rem;
    color: var(--color-text-light);
    line-height: 1.9;
    white-space: pre-wrap;
    max-height: 500px;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.3s;
  }
  .author-note-wrapper.collapsed .note-body {
    max-height: 0;
    padding: 0 20px;
  }
  .chapter-content {
    font-family: var(--font-serif);
    font-size: 1.08rem;
    line-height: 2.2;
    color: #2D2D2D;
    letter-spacing: 0.5px;
  }
  .chapter-content p {
    text-indent: 2em;
    margin-bottom: 0.8em;
  }
  .chapter-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid var(--color-line);
    gap: 12px;
  }
  .chapter-nav a, .chapter-nav .nav-placeholder {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: var(--radius);
    font-size: 0.9rem;
    color: var(--color-primary);
    text-decoration: none;
    border: 1.5px solid var(--color-primary-light);
    transition: all 0.3s ease;
    min-width: 120px;
    justify-content: center;
  }
  .chapter-nav a:hover {
    background: var(--color-primary);
    color: #fff;
    border-color: var(--color-primary);
  }
  .chapter-nav .nav-placeholder {
    color: var(--color-text-lighter);
    border-color: var(--color-line);
    cursor: default;
  }
  .deco-line {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--color-primary-light), var(--color-accent-light), transparent);
    margin: 40px 0;
    border: none;
  }
  .content-empty-hint {
    text-align: center;
    padding: 60px 20px;
    color: var(--color-text-lighter);
  }
  .content-empty-hint .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
  ::selection { background: var(--color-primary-lighter); color: var(--color-primary); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--color-primary-light); border-radius: 3px; }
  @media (max-width: 640px) {
    .main-container { padding: 40px 16px; }
    .chapter-title { font-size: 1.35rem; }
    .chapter-content { font-size: 1rem; line-height: 2.1; }
    .chapter-nav a, .chapter-nav .nav-placeholder {
      min-width: 90px; padding: 8px 12px; font-size: 0.82rem;
    }
  }
</style>
</head>
<body>
<div class="main-container">

  <div class="chapter-header">
    <h1 class="chapter-title">阅前必读</h1>
  </div>

    <div class="chapter-intro">
      <div class="intro-label">📋 简介</div>
      <div>高山流水遇知音！</div>
    </div>
  <div class="chapter-content">

    <div class="chapter-nav">
      <span class="nav-placeholder">← 上一章</span>
      <a href="rain1.html">下一章 →</a>
    </div>

</div>

function toggleNote() {
  var el = document.getElementById('author-note');

}
</script>
</body>
</html>
